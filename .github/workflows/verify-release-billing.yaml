name: Verify release billing

on:
  workflow_dispatch:
    inputs:
      configure_sdk_key:
        description: Configure the backend getter with the existing App Store SDK key
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}
      - name: Inspect deployed purchase verification
        env:
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          CONFIGURE_SDK_KEY: ${{ inputs.configure_sdk_key }}
        run: |
          ssh -o StrictHostKeyChecking=no "$DROPLET_USER@$DROPLET_HOST" "cd /home/sammy/GreekGeek/Backend/GreekGeekApi && RELEASE_CONFIGURE_SDK_KEY=$CONFIGURE_SDK_KEY ../.venv/bin/python manage.py shell" <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          import re
          import subprocessquests
          from django.conf import settings
          from django.urls import resolve
          from dotenv import find_dotenv, set_key
          from Study.models import Org, User
          from django.db import transaction
          from django.test import override_settings
          from rest_framework.test import APIClient
          org = Org.objects.get(id=16, name='Apple Paid')
          key = settings.REVENUECAT_API_KEY
          if os.environ.get('RELEASE_CONFIGURE_SDK_KEY') == 'true':
              source = subprocess.check_output(['git', 'show', 'origin/main:GreekGeekStudy/constants/revenuecat.ts'], cwd=settings.BASE_DIR, text=True)
              key = re.search(r"'(appl_[^']+)'", source).group(1)
              response = requests.get(
                  f'https://api.revenuecat.com/v1/subscribers/{org.revenuecat_app_user_id}',
                  headers={'Authorization': f'Bearer {key}'}, timeout=15,
              )
              response.raise_for_status()
              env_path = find_dotenv(usecwd=True)
              assert env_path, 'Backend environment file not found'
              set_key(env_path, 'REVENUECAT_API_KEY', key)
          result = {
              'route': resolve('/api/billing/sync-revenuecat/').url_name,
              'revenuecat_key_configured': bool(key),
              'webhook_configured': bool(settings.REVENUECAT_WEBHOOK_AUTHORIZATION),
              'entitlement': settings.REVENUECAT_ENTITLEMENT_ID,
              'product': settings.REVENUECAT_PRODUCT_ID,
          }
          if key:
              response = requests.get(
                  f'https://api.revenuecat.com/v1/subscribers/{org.revenuecat_app_user_id}',
                  headers={'Authorization': f'Bearer {key}'},
                  timeout=15,
              )
              result['revenuecat_http_status'] = response.status_code
              if response.status_code == 200:
                  subscriber = response.json().get('subscriber', {})
                  result['subscription_products'] = list(subscriber.get('subscriptions', {}))
                  result['entitlements'] = list(subscriber.get('entitlements', {}))
              else:
                  result['error_code'] = response.json().get('code')
                  result['error_message'] = response.json().get('message')
          if key and result.get('revenuecat_http_status') == 200:
              original_premium = org.is_premium
              with transaction.atomic(), override_settings(REVENUECAT_API_KEY=key, ALLOWED_HOSTS=['testserver']):
                  client = APIClient()
                  client.force_authenticate(user=User.objects.get(email='admin@apple2.com', org=org, is_staff=True))
                  synced = client.post('/api/billing/sync-revenuecat/', {}, format='json')
                  org.refresh_from_db()
                  result['sync_endpoint_status'] = synced.status_code
                  result['verified_subscription_status'] = org.revenuecat_subscription_status
                  result['verified_premium'] = org.is_premium
                  assert synced.status_code == 200, 'Live subscriber sync failed'
                  assert synced.data['billing']['is_premium'] == org.is_premium
                  transaction.set_rollback(True)
              org.refresh_from_db()
              result['manual_test_access_preserved'] = org.is_premium == original_premium
          print(json.dumps(result))
          PY
          if [ "$CONFIGURE_SDK_KEY" = "true" ]; then
            ssh -o StrictHostKeyChecking=no "$DROPLET_USER@$DROPLET_HOST" 'sudo -n systemctl restart gunicorn && sudo -n systemctl is-active gunicorn'
          fi
